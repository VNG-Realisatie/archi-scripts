# Static type check and Node checks of the View subsystem (types/README.md, Scripts/View/docs/ARCHITECTURE.md § Development and testing).
# The rule checks run every algorithm, with the Graphviz version the known violations hold (from Graphviz's own Ubuntu
# packages) and the font Times resolves to locally (Nimbus Roman): their violations equal the local ones. Graphviz
# fingerprints still differ between builds of one version (label places, Dot's routing), so they are compared
# without the Graphviz algorithms. Archi itself does not run here.
name: check

on:
  push:
  pull_request:

env:
  GRAPHVIZ_VERSION: 14.1.4

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Graphviz
        run: |
          curl -sSfL -o "$RUNNER_TEMP/graphviz.tar.xz" \
            "https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/$GRAPHVIZ_VERSION/ubuntu_24.04_graphviz-$GRAPHVIZ_VERSION-debs.tar.xz"
          tar -xJf "$RUNNER_TEMP/graphviz.tar.xz" -C "$RUNNER_TEMP" \
            "graphviz_$GRAPHVIZ_VERSION-1_amd64.deb" "libgraphviz4_$GRAPHVIZ_VERSION-1_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y fonts-urw-base35 \
            "$RUNNER_TEMP/graphviz_$GRAPHVIZ_VERSION-1_amd64.deb" "$RUNNER_TEMP/libgraphviz4_$GRAPHVIZ_VERSION-1_amd64.deb"
          dot -V
          fc-match Times-Roman
      - run: npm run typecheck
      - name: Unit
        run: |
          node Scripts/View/tools/rel_filter_test.js
          node Scripts/View/tools/nesting_test.js
          node Scripts/View/tools/compose_test.js
          node Scripts/View/tools/counts_test.js
          node Scripts/View/tools/tiles_test.js
      - name: Consistency
        run: |
          node Scripts/View/tools/check_registry.js
          node Scripts/View/tools/gen_docs_tables.js
      - name: Fingerprints (write plans, variants, layouts)
        run: |
          node Scripts/View/tools/write_plans.js --check --in-process --without-graphviz
          node Scripts/View/tools/write_plans.js --variants --check --in-process --without-graphviz
          node tools/compare-layouts.js --check --in-process --without-graphviz
      - name: Rule checks
        run: |
          node Scripts/View/tools/layout_checks.js --check --in-process
          node Scripts/View/tools/layout_checks.js --variants --check --in-process
          node Scripts/View/tools/layout_checks.js --large --check --in-process
