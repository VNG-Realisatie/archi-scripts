# Static type check and Node checks of the View subsystem (types/README.md, Scripts/View/docs/ARCHITECTURE.md § Development and testing).
# Fingerprints and known violations are compared without the Graphviz algorithms: their results depend on the
# Graphviz version (the expected files hold dot 14.1.4's). Archi itself does not run here.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit
        run: |
          node Scripts/View/tools/rel_filter_test.js
          node Scripts/View/tools/nesting_test.js
          node Scripts/View/tools/compose_test.js
          node Scripts/View/tools/counts_test.js
          node Scripts/View/tools/tiles_test.js
      - name: Consistency
        run: |
          node Scripts/View/tools/check_registry.js
          node Scripts/View/tools/gen_docs_tables.js
      - name: Fingerprints (write plans, variants, layouts)
        run: |
          node Scripts/View/tools/write_plans.js --check --in-process --without-graphviz
          node Scripts/View/tools/write_plans.js --variants --check --in-process --without-graphviz
          node tools/compare-layouts.js --check --in-process --without-graphviz
      - name: Rule checks
        run: |
          node Scripts/View/tools/layout_checks.js --check --in-process --without-graphviz
          node Scripts/View/tools/layout_checks.js --variants --check --in-process --without-graphviz
          node Scripts/View/tools/layout_checks.js --large --check --in-process --without-graphviz
      # The Graphviz algorithms' rule checks, with the runner's Graphviz: reported, not blocking, while
      # their known list holds a finding not fixed yet (plan/view-test-plan.md, F11).
      - run: sudo apt-get install -y graphviz
      - name: Rule checks, Graphviz (report)
        continue-on-error: true
        run: |
          node Scripts/View/tools/layout_checks.js --check --in-process || rc=1
          node Scripts/View/tools/layout_checks.js --variants --check --in-process || rc=1
          exit ${rc:-0}
